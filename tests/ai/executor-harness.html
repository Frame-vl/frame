<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="theme-color" content="#0f1113"><title>FRAME Executor Boundary Harness</title></head>
<body>
<button id="brandHome"></button><button id="globalDocsBtn"></button><button id="settingsBtn"></button>
<button id="lightBtn"></button><button id="darkBtn"></button><button id="closeDocumentBtn"></button><button id="printDocumentBtn"></button>
<div id="viewHost"></div><div id="sheet"><div id="sheetPanel"></div></div><div id="documentView" class="hidden"></div><div id="toast"></div>
<pre id="result">RUNNING</pre>
<script>window.FRAME_TEST_SKIP_APP_INIT=true;window.FRAME_AI_TEST_ALLOW_SYNTHETIC_APPLY=true;</script>
<script src="../../ai-safety.js"></script>
<script src="../../app.js"></script>
<script>
(async()=>{
  const failures=[];
  const assert=(ok,message)=>{if(!ok)failures.push(message)};
  try{
    aiServerUrl=()=> 'https://field.invalid/frame-field';
    aiServerToken=()=> 'executor-test-token';
    aiRecordAuthenticatedHealth('field_safe',{url:aiServerUrl(),authenticated:true});

    const object=defaultObject(),order=object.orders[0];
    object.id='obj-executor';object.contact.address='Тестовая, 1';
    order.id='order-executor';order.title='Полевой тест';order.works=[];
    objects=[normalizeObject(object)];
    route='ai';routeState={aiTarget:'obj-executor|order-executor'};

    let dbWrites=0,auditSequence=0;
    const audit=[],auditSnapshots=[];
    dbApplyBatch=async(upserts=[],deleteIds=[],expectedRevisions=null)=>{const checks=expectedRevisions instanceof Map?[...expectedRevisions.entries()]:Object.entries(expectedRevisions||{});for(const [id,revision] of checks){const actual=objects.find(item=>item.id===String(id)),valid=revision===null?!actual:!!actual&&String(actual.updatedAt||'')===String(revision);if(!valid)throw new Error('test revision conflict')}dbWrites++;for(const id of deleteIds)objects=objects.filter(item=>item.id!==id);for(const value of upserts){const normalized=normalizeObject(clone(value)),index=objects.findIndex(x=>x.id===normalized.id);if(index>=0)objects[index]=normalized;else objects.push(normalized)}};
    dbPut=async value=>dbApplyBatch([value],[]);
    reloadObjects=async()=>{};
    mirrorBackup=()=>{};
    render=()=>{};
    toast=()=>{};
    addAiLog=entry=>{const row=aiSanitizeAuditEntries([{id:`audit-test-${++auditSequence}`,at:now(),undone:false,...entry}])[0];audit.push(row);return row};
    aiLogs=()=>clone(audit);
    saveAiLogs=items=>{const clean=aiSanitizeAuditEntries(items);audit.splice(0,audit.length,...clone(clean));auditSnapshots.push(clone(clean));return JSON.stringify(aiSanitizeAuditEntries(audit))===JSON.stringify(clean)};

    const response={meta:{mode:'candidate',provider:'private provider words'},result:{summary:'private utterance must stay in session',actions:[{type:'add_work',object_id:object.id,order_id:order.id,work_name:'Проверенная работа',qty:2,unit:'м',price:500}]}};
    const draft=aiSafeDraftFromResponse('private utterance must stay in session',response,routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    draft.chatId='executor-draft-1';
    assert(draft.ok&&draft.mode==='field_safe','production parser did not pin /frame-field locally');

    const direct=await applyBrainDraft(draft,'');
    assert(direct===false&&dbWrites===0&&objects[0].orders[0].works.length===0,'real executor accepted direct invocation without Apply');

    const applyButton=document.createElement('button');document.body.appendChild(applyButton);
    let applyPromise=null,usedAuthorization='';
    assert(aiBindDisplayedDraftApply(applyButton,draft,token=>{usedAuthorization=token;applyPromise=applyBrainDraft(draft,token)}),'production Apply gate did not arm displayed draft');
    applyButton.click();
    const applied=await applyPromise;
    assert(applied===true&&dbWrites===1&&objects[0].orders[0].works.length===1,'real executor did not apply authorized draft exactly once');
    assert(objects[0].orders[0].works[0].name==='Проверенная работа','real executor applied wrong work payload');
    assert(audit.length===1&&!JSON.stringify(audit).includes('private utterance')&&!JSON.stringify(audit).includes('private provider'),'real executor leaked provider text into durable audit');

    const replay=await applyBrainDraft(draft,usedAuthorization);
    assert(replay===false&&dbWrites===1&&objects[0].orders[0].works.length===1,'real executor replayed consumed authorization');

    const tamper=aiSafeDraftFromResponse('tamper',response,routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    tamper.chatId='executor-draft-2';
    const tamperButton=document.createElement('button');document.body.appendChild(tamperButton);
    let tamperCalled=false;
    assert(aiBindDisplayedDraftApply(tamperButton,tamper,()=>{tamperCalled=true}),'tamper draft did not arm before display mutation');
    tamper.actions[0].price=999999;
    tamperButton.click();
    await new Promise(resolve=>setTimeout(resolve,0));
    assert(!tamperCalled&&dbWrites===1,'changed displayed draft passed exact signature gate');

    const beforeInvalid=objects[0].orders[0].works.length;
    const invalidBatch=aiSafeDraftFromResponse('Добавь работу и пустую заметку',{meta:{mode:'field_safe'},result:{summary:'invalid atomic batch',actions:[
      {type:'add_work',object_id:object.id,order_id:order.id,work_name:'Не должна сохраниться',qty:1,unit:'шт.',price:100},
      {type:'add_note',object_id:object.id,order_id:order.id,note:''}
    ]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    invalidBatch.chatId='executor-invalid-batch';
    const invalidButton=document.createElement('button');document.body.appendChild(invalidButton);let invalidPromise;
    aiBindDisplayedDraftApply(invalidButton,invalidBatch,token=>{invalidPromise=applyBrainDraft(invalidBatch,token)});invalidButton.click();
    assert(await invalidPromise===false&&dbWrites===1&&objects[0].orders[0].works.length===beforeInvalid,'invalid multi-action plan partially committed');

    const liveOrder=objects[0].orders[0],closure=normalizeWorkClosure({id:'closure-1',number:1,date:'2026-09-03',amount:1000,snapshot:[normalizeGenericRow({name:'Проверенная работа',qty:'2',unit:'м',price:'500'},'Работы')]});liveOrder.workClosures=[closure];
    const docDraft=aiSafeDraftFromResponse('Создай акт по закрытию номер 1',{meta:{mode:'field_safe'},result:{summary:'document plan',actions:[{type:'create_document',object_id:object.id,order_id:order.id,document_type:'act',closure_id:closure.id}]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    docDraft.chatId='executor-document';const docButton=document.createElement('button');document.body.appendChild(docButton);let docPromise;
    assert(aiBindDisplayedDraftApply(docButton,docDraft,token=>{docPromise=applyBrainDraft(docDraft,token)}),'document draft did not arm');docButton.click();
    assert(await docPromise===true&&objects[0].orders[0].documentHistory.length===1,'authorized document was not persisted');
    const documentEntry=objects[0].orders[0].documentHistory[0];
    assert(documentEntry.type==='act'&&documentEntry.closureId==='closure-1'&&frameLastApplyReceipt?.entityIds?.documentId===documentEntry.id,'document receipt is not linked to the persisted document');
    assert(frameLastApplyReceipt?.links?.[0]?.kind==='document'&&frameLastApplyReceipt.links[0].documentId===documentEntry.id,'document receipt has no openable local link');
    const documentLogId=frameLastApplyReceipt?.logId;

    const missingMetaPayment=aiSafeDraftFromResponse('payment',{result:{summary:'pay',actions:[{type:'add_payment',object_id:object.id,order_id:order.id,amount:1000}]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    assert(!missingMetaPayment.ok&&missingMetaPayment.blocked,'missing provider mode exposed payment under /frame-field');
    const forgedShape={...draft,chatId:'executor-draft-3',type:'payment',actions:[{type:'add_note',object_id:object.id,order_id:order.id,note:'x'}]};
    aiDraft=forgedShape;
    const forgedResult=await applyAiDraft('');
    assert(forgedResult===false&&dbWrites===2,'field draft type/action shape bypassed real local executor');

    const undoSnapshotStart=auditSnapshots.length;
    const documentUndo=await undoLastAiAction(documentLogId);
    assert(documentUndo.ok&&documentUndo.postconditionVerified&&objects[0].orders[0].documentHistory.length===0,'verified document undo did not remove the exact document');
    const undoSnapshots=auditSnapshots.slice(undoSnapshotStart),documentAudit=audit.find(item=>item.id===documentLogId);
    assert(undoSnapshots[0]?.find(item=>item.id===documentLogId)?.undoPending===true,'undo did not persist its pending phase before changing data');
    assert(documentAudit?.undone===true&&documentAudit?.undoPending===false,'undo journal did not finish in a verified done state');

    const autoOrder=objects[0].orders[0],autoWork=autoOrder.works[0];
    autoWork.progressPct=100;autoWork.closedAmount=0;autoOrder.workClosures=[];
    const autoDraft=aiSafeDraftFromResponse('Выкати акт',{meta:{mode:'field_safe'},result:{summary:'auto-close document plan',actions:[{type:'create_document',object_id:object.id,order_id:order.id,document_type:'act',closure_id:''}]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    autoDraft.chatId='executor-auto-close-document';const autoButton=document.createElement('button');document.body.appendChild(autoButton);let autoPromise;
    assert(autoDraft.ok&&aiBindDisplayedDraftApply(autoButton,autoDraft,token=>{autoPromise=applyBrainDraft(autoDraft,token)}),'auto-close document draft did not arm');autoButton.click();
    assert(await autoPromise===true&&objects[0].orders[0].documentHistory.length===1&&objects[0].orders[0].workClosures.length===1,'act did not atomically freeze ready volume and persist document');
    const autoDocument=objects[0].orders[0].documentHistory[0],autoClosure=objects[0].orders[0].workClosures[0],autoLogId=frameLastApplyReceipt?.logId;
    assert(autoDocument.closureId===autoClosure.id&&autoWork.id===objects[0].orders[0].works[0].id&&objects[0].orders[0].works[0].closedAmount===1000,'auto-close act did not bind its immutable closure');
    const autoUndo=await undoLastAiAction(autoLogId);
    assert(autoUndo.ok&&autoUndo.postconditionVerified&&objects[0].orders[0].documentHistory.length===0&&objects[0].orders[0].workClosures.length===0&&objects[0].orders[0].works[0].closedAmount===0,'auto-close document undo did not restore document, closure, and work amount together');

    objects[0].orders[0].workClosures=[clone(closure)];objects[0].orders[0].works[0].closedAmount=1000;objects[0].orders[0].works[0].progressPct=50;
    const correctedDraft=aiSafeDraftFromResponse('По выполненным работам этого объекта сделай акт',{meta:{mode:'field_safe'},result:{summary:'corrected document plan',actions:[{type:'create_document',object_id:object.id,order_id:order.id,document_type:'act',closure_id:''}]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    correctedDraft.chatId='executor-current-state-document';const correctedButton=document.createElement('button');document.body.appendChild(correctedButton);let correctedPromise;
    assert(correctedDraft.ok&&aiBindDisplayedDraftApply(correctedButton,correctedDraft,token=>{correctedPromise=applyBrainDraft(correctedDraft,token)}),'client safety rejected a current-state act after an old full closure');correctedButton.click();
    assert(await correctedPromise===true&&objects[0].orders[0].documentHistory.length===1,'current-state act was not persisted through the real executor');
    const correctedDocument=objects[0].orders[0].documentHistory.at(-1),correctedLogId=frameLastApplyReceipt?.logId;
    assert(correctedDocument.closureId===''&&correctedDocument.total===500&&correctedDocument.snapshot.length===1&&parseNum(correctedDocument.snapshot[0].qty)===1,'corrected current-state act did not use only the currently completed volume');
    const correctedUndo=await undoLastAiAction(correctedLogId);
    assert(correctedUndo.ok&&correctedUndo.postconditionVerified&&objects[0].orders[0].documentHistory.length===0&&objects[0].orders[0].workClosures.length===1,'current-state document undo did not preserve the historical closure');
    objects[0].orders[0].works[0].progressPct=100;

    // Exact stateful replay of Nikolai's 2026-09-05 field test.  This is
    // intentionally broader than the one-row regression above: a historical
    // full act exists, eight rows are corrected back to 0%, three electrical
    // rows are then completed again, and both current-state documents must be
    // rebuilt from the live 12/17 rows rather than the historical closure.
    const ownerWorks=[
      ['owner-plumbing','Сантехнические работы полный монтаж',1,'компл.',50000],
      ['owner-installation','Монтаж инсталляции под унитаз',1,'шт.',10000],
      ['owner-box','Зашивка коробом инсталляции и трубы',1,'компл.',15000],
      ['owner-shower','Монтаж душевого поддона с бортиком',1,'компл.',15000],
      ['owner-cable-chase','Прокладка кабеля в штробе',17,'пог. м',200],
      ['owner-cable-open','Прокладка кабеля открытая',20,'пог. м',150],
      ['owner-sockets','Устройство гнёзд под розетки и выключатели',10,'шт.',500],
      ['owner-switches','Монтаж розеток и выключателей',20,'шт.',250],
      ['owner-vinyl','Укладка кварц-винила на пол',35,'м²',800],
      ['owner-plinth','Монтаж плинтуса ПВХ',25,'пог. м',300],
      ['owner-fleece','Поклейка малярного флизелина',60,'м²',450],
      ['owner-door','Монтаж межкомнатной двери',1,'шт.',7000],
      ['owner-wall-tile','Укладка керамогранита на стены',10,'м²',4000],
      ['owner-floor-tile','Укладка керамогранита на пол',3,'м²',3500],
      ['owner-podium','Облицовка подиума душевого поддона керамогранитом',1,'компл.',10000],
      ['owner-paint','Покраска стен',70,'м²',450],
      ['owner-waterproof','Устройство гидроизоляции санузла',7,'м²',800]
    ];
    const ownerObject=defaultObject(),ownerOrder=ownerObject.orders[0];
    ownerObject.id='obj-owner-history';ownerObject.contact.address='Архангельское 21, корпус 5, квартира 80';
    ownerOrder.id='order-owner-history';ownerOrder.title='Ремонт квартиры';ownerOrder.pricing.contractTotal='273500';
    ownerOrder.works=ownerWorks.map(([id,name,qty,unit,price])=>({id,name,qty:String(qty),unit,price:String(price),progressPct:100,closedAmount:qty*price,progressNote:''}));
    const fullSnapshot=ownerOrder.works.map(row=>normalizeGenericRow({name:row.name,qty:row.qty,unit:row.unit,price:row.price},'Работы'));
    ownerOrder.workClosures=[normalizeWorkClosure({id:'owner-full-closure',number:1,date:'2026-09-05',amount:273500,snapshot:fullSnapshot})];
    ownerOrder.documentHistory=[];objects=[normalizeObject(ownerObject)];routeState.aiTarget='obj-owner-history|order-owner-history';
    const executeOwnerDraft=async(chatId,text,actions)=>{const candidate=aiSafeDraftFromResponse(text,{meta:{mode:'field_safe'},result:{summary:'owner history replay',actions}},routeState.aiTarget,'Архангельское 21 · Ремонт квартиры');candidate.chatId=chatId;const button=document.createElement('button');document.body.appendChild(button);let promise;assert(candidate.ok&&aiBindDisplayedDraftApply(button,candidate,token=>{promise=applyBrainDraft(candidate,token)}),chatId+' did not arm');button.click();assert(await promise===true,chatId+' did not apply');return objects[0].orders[0]};
    const incompleteIds=['owner-cable-chase','owner-cable-open','owner-sockets','owner-switches','owner-vinyl','owner-wall-tile','owner-floor-tile','owner-podium'];
    let replayOrder=await executeOwnerDraft('owner-remove-eight','Электромонтаж, напольное покрытие и керамогранит не выполнены',incompleteIds.map(work_id=>({type:'set_work_progress',object_id:ownerObject.id,order_id:ownerOrder.id,work_id,progress_pct:0})));
    assert(replayOrder.works.filter(row=>workProgressPct(row)===100).length===9,'owner replay did not preserve exact 9/17 corrected completed rows');
    replayOrder=await executeOwnerDraft('owner-corrected-act','Сделай откорректированный акт выполненных работ',[{type:'create_document',object_id:ownerObject.id,order_id:ownerOrder.id,document_type:'act',closure_id:''}]);
    let replayDoc=replayOrder.documentHistory.at(-1);
    assert(replayDoc.closureId===''&&replayDoc.total===168600&&replayDoc.snapshot.length===9,'corrected 9/17 act reused the historical 273500 closure or has the wrong live total');
    const restoredElectrical=['owner-cable-chase','owner-cable-open','owner-sockets'];
    replayOrder=await executeOwnerDraft('owner-complete-three-electrical','Прокладка кабеля в штробе, открытая прокладка и устройство гнёзд выполнены',restoredElectrical.map(work_id=>({type:'set_work_progress',object_id:ownerObject.id,order_id:ownerOrder.id,work_id,progress_pct:100})));
    assert(replayOrder.works.filter(row=>workProgressPct(row)===100).length===12,'owner replay did not reach exact 12/17 current completion state');
    replayOrder=await executeOwnerDraft('owner-current-worklist','По выполненным работам сделай перечень',[{type:'create_document',object_id:ownerObject.id,order_id:ownerOrder.id,document_type:'worklist',closure_id:''}]);
    replayDoc=replayOrder.documentHistory.at(-1);
    assert(replayDoc.closureId===''&&replayDoc.total===180000&&replayDoc.snapshot.length===12,'current worklist did not use the exact 12/17 live rows and 180000 total');
    replayOrder=await executeOwnerDraft('owner-current-act','По выполненным работам этого объекта сделай акт',[{type:'create_document',object_id:ownerObject.id,order_id:ownerOrder.id,document_type:'act',closure_id:''}]);
    replayDoc=replayOrder.documentHistory.at(-1);const replayNames=replayDoc.snapshot.map(row=>row.name).join('|');
    assert(replayDoc.closureId===''&&replayDoc.total===180000&&replayDoc.snapshot.length===12,'current act did not use the exact 12/17 live rows and 180000 total');
    assert(!/Монтаж розеток|кварц-винил|керамогранита/.test(replayNames),'current act leaked one of the five unfinished rows');
    assert(replayOrder.workClosures.length===1&&replayOrder.workClosures[0].amount===273500,'current documents mutated or replaced the historical full closure');
    objects=[normalizeObject(object)];routeState.aiTarget='obj-executor|order-executor';

    const secondDocDraft=aiSafeDraftFromResponse('Создай ещё один акт по закрытию номер 1',{meta:{mode:'field_safe'},result:{summary:'second document plan',actions:[{type:'create_document',object_id:object.id,order_id:order.id,document_type:'act',closure_id:closure.id}]}},routeState.aiTarget,'Тестовая, 1 · Полевой тест');
    secondDocDraft.chatId='executor-document-2';const secondDocButton=document.createElement('button');document.body.appendChild(secondDocButton);let secondDocPromise;
    aiBindDisplayedDraftApply(secondDocButton,secondDocDraft,token=>{secondDocPromise=applyBrainDraft(secondDocDraft,token)});secondDocButton.click();
    assert(await secondDocPromise===true&&objects[0].orders[0].documentHistory.length===1,'second document setup failed');
    const secondLogId=frameLastApplyReceipt?.logId,secondLog=audit.find(item=>item.id===secondLogId),expectedRevision=secondLog?.undo?.postRevisions?.[0]?.updatedAt,writeCountBeforeDrift=dbWrites;
    objects[0].updatedAt=aiNextObjectRevision(expectedRevision);
    const driftUndo=await undoLastAiAction(secondLogId);
    assert(!driftUndo.ok&&dbWrites===writeCountBeforeDrift&&objects[0].orders[0].documentHistory.length===1,'undo overwrote a card after revision drift');
    assert(!audit.find(item=>item.id===secondLogId)?.undone&&!audit.find(item=>item.id===secondLogId)?.undoPending,'blocked drift undo left a false success or permanent pending state');

    objects[0].updatedAt=expectedRevision;
    objects[0].orders[0].documentHistory=[];
    const missingUndo=await undoLastAiAction(secondLogId);
    assert(!missingUndo.ok&&dbWrites===writeCountBeforeDrift,'missing inverse entity produced a no-op success');
    assert(!audit.find(item=>item.id===secondLogId)?.undone,'missing inverse entity was marked undone');
  }catch(error){failures.push('exception: '+(error?.stack||error))}
  document.getElementById('result').textContent=failures.length?`FRAME_EXECUTOR_E2E_FAIL\n${failures.join('\n')}`:'FRAME_EXECUTOR_E2E_PASS';
})();
</script>
</body></html>
