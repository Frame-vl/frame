    assert(frameTestTranscriptRead()?.remote_sync===false,'local recording silently enabled remote synchronization');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameOwnerTestOutboxV279'),'local-only consent queued a remote event');
    assert(frameTestTranscriptRead()?.messages?.length===0&&!JSON.stringify(frameTranscriptPayload()).includes(beforeConsent.text),'starting test transcript backfilled pre-consent traffic');
    frameStopTestTranscript();

    const redactionSecrets=['+7 (999) 111-22-33','secret@example.com','sk-abcdefghijklmnop','ghp_ABCDEFGHIJKLMNOPQRSTUVWX','xoxb-1234567890-ABCDEFGHIJ','AIzaABCDEFGHIJKLMNOPQRSTUVWXYZ123456','eyJabcdef.ghijklmnop.qrstuvwxyz','https://user:password@example.com/path?access_token=topsecret'];
    frameAddChat({role:'user',text:`Позвони ${redactionSecrets.join(', ')} — но сам смысл сообщения оставь`,status:'done',turnId:'private-redaction'});
    const scrubbedLocal=JSON.stringify(frameTranscriptPayload());
    assert(redactionSecrets.every(secret=>!scrubbedLocal.includes(secret)),'local transcript/export retained recognized credentials or contact details');
    assert(scrubbedLocal.includes('сам смысл сообщения оставь')&&scrubbedLocal.includes('[скрыт'),'redaction dropped the useful message instead of masking its secrets');
    frameChatSession=[];

    const localTraces=[
      frameBuildTestTrace({ok:true,type:'payment',targetKey:TARGET.key,amount:1500},null,12),

    assert(richAction.purchase_id==='purchase-1'&&richAction.customer_name==='Николай'&&richAction.phone==='+7 900'&&richAction.object_status==='work'&&richAction.order_status==='agreed'&&richAction.new_name==='Новое имя'&&richAction.category==='Посредник','executor action fields were dropped from transcript');

    window.aiBrainFetch=()=>new Promise(resolve=>{resolveOldHealth=resolve});

    aiBrainStatus={ok:true,mode:'field_safe'};
    const chainedOrder=aiSafeDraftFromResponse('Создай заказ и добавь работу',{meta:{mode:'field_safe'},result:{summary:'plan',actions:[
      {type:'create_order',object_id:OBJECT.id,order_id:'@new_order_1',order_title:'Второй заказ'},
      {type:'add_work',object_id:OBJECT.id,order_id:'@new_order_1',work_name:'Штукатурка',qty:1,unit:'компл.',price:1000}
    ]}},TARGET.key,'Архангельская, 21 · Ремонт квартиры');
    assert(chainedOrder.ok&&!chainedOrder.blocked,'legitimate create_order to add_work dependency was rejected');
    await new Promise(r=>setTimeout(r,25));
    assert(WAKE_REQUESTS===0&&WAKE_OUTSTANDING===0,'render acquired a wake lock without focused composer or voice');

    composer.value=Array.from({length:60},(_,index)=>`строка ${index}`).join('\n');composer.setSelectionRange(composer.value.length,composer.value.length);composer.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,25));
    assert(composer.selectionEnd===composer.value.length&&composer.scrollTop+composer.clientHeight>=composer.scrollHeight-1,'long typed input did not keep the visible viewport at the newest text');
