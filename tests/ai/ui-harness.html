<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>FRAME UI E2E Harness</title></head>
<body><div id="app"></div><pre id="result">RUNNING</pre>
<script>
const STORE={};
window.CAPTURED=[];
let BRAIN_REPLY=null;
window.storageGet=(k,d='')=>Object.prototype.hasOwnProperty.call(STORE,k)?STORE[k]:d;
window.storageSet=(k,v)=>{STORE[k]=String(v)};
window.uid=()=> 'id-'+Math.random().toString(36).slice(2);
window.now=()=> new Date().toISOString();
window.$=id=>document.getElementById(id);
window.$$=sel=>Array.from(document.querySelectorAll(sel));
window.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.toast=()=>{};
window.openSheet=()=>{};
window.render=()=>{document.getElementById('app').innerHTML=renderAiView();bindAiView()};
window.route='ai';
window.routeState={aiTarget:'obj-arch|order-arch'};
window.aiDraft=null;
window.aiAnalyzing=false;
window.aiRecognition=null;
window.aiBrainStatus={ok:true};
window.checkAiBrain=async()=>({ok:true});
window.renderAiView=()=> '';
window.analyzeAiInput=async()=>{};
window.startAiVoice=()=>{};
window.bindAiResult=()=>{};
window.bindAiView=()=>{};
window.aiNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
window.aiTokens=s=>window.aiNorm(s).split(/[^a-zа-я0-9]+/i).filter(Boolean);
window.aiStem=s=>window.aiNorm(s).slice(0,6);
window.parseNum=v=>Number(String(v??'').replace(',','.').replace(/[^0-9.\-]/g,''))||0;
window.money=v=>`${Number(v||0).toLocaleString('ru-RU')} ₽`;

const ORDER={id:'order-arch',title:'Ремонт квартиры',works:[
  {id:'w-install',name:'Монтаж инсталляции',qty:1,unit:'компл.',price:10000,progress_pct:100},
  {id:'w-toilet',name:'Установка унитаза и кнопки',qty:1,unit:'компл.',price:3000,progress_pct:0},
  {id:'w-shared-arch',name:'Гидроизоляция стен',qty:1,unit:'компл.',price:5000,progress_pct:0}
]};
const OBJECT={id:'obj-arch',contact:{address:'Архангельская, 21',name:'Заказчик'},orders:[ORDER]};
const TARGET={key:'obj-arch|order-arch',object:OBJECT,order:ORDER};

const ORDER2={id:'order-ves',title:'Сантехнические работы',works:[
  {id:'w-water',name:'Вода и канализация',qty:1,unit:'компл.',price:35000,progress_pct:0},
  {id:'w-shower',name:'Монтаж душевого поддона',qty:1,unit:'компл.',price:12000,progress_pct:0},
  {id:'w-shared-ves',name:'Гидроизоляция стен',qty:1,unit:'компл.',price:5000,progress_pct:0}
]};
const OBJECT2={id:'obj-ves',contact:{address:'Веселковая, 12Б',name:'Офис'},orders:[ORDER2]};
const TARGET2={key:'obj-ves|order-ves',object:OBJECT2,order:ORDER2};
const TARGETS=[TARGET,TARGET2];

window.aiDefaultTargetKey=()=>TARGET.key;
window.aiTargetByKey=key=>TARGETS.find(x=>x.key===key)||null;
window.aiAllTargets=()=>TARGETS;
window.aiFindWork=(order,text)=>{const tokens=aiTokens(text);let best=null,bestScore=0;for(const row of order?.works||[]){const name=aiNorm(row.name),nameTokens=aiTokens(name);let score=0;for(const token of tokens){if(name.includes(token))score+=3;else if(nameTokens.some(n=>n.startsWith(token)||token.startsWith(n)))score+=2}if(score>bestScore){best=row;bestScore=score}}return bestScore>=2?best:null};
window.aiContextPayload=()=>({current_target:routeState.aiTarget||TARGET.key,objects:TARGETS.map(t=>({id:t.object.id,address:t.object.contact.address,orders:[{id:t.order.id,title:t.order.title,works:t.order.works}]}))});
window.aiServerUrl=()=> 'http://127.0.0.1:8787';
window.aiBrainFetch=async()=>({ok:true,provider:'test',model:'test'});
window.requestAiBrain=async text=>{CAPTURED.push(String(text||''));return BRAIN_REPLY||{result:{actions:[],summary:'stub'}}};
const AI_FIELD_SAFE_ACTIONS=new Set(['add_work','set_work_progress','add_note']);
window.aiFieldSafeDraftError=d=>{if(String(d?.mode||'')!=='field_safe')return '';if((d?.actions||[]).some(a=>!AI_FIELD_SAFE_ACTIONS.has(String(a?.type||''))))return 'FRAME заблокировал весь пакет изменений в безопасном режиме. Ничего не применено.';const expected=String(d?.targetKey||'').split('|');return (d?.actions||[]).some(a=>String(a?.object_id||'')!==expected[0]||String(a?.order_id||'')!==expected[1])?'FRAME заблокировал изменение: цель ответа не совпала с выбранным объектом. Ничего не применено.':''};
window.brainDraftFromResponse=(text,response)=>{
  const r=response?.result||{},mode=String(response?.meta?.mode||''),common={mode,text};
  if(r.needs_clarification)return {ok:false,source:'brain',clarification:true,error:r.clarification||'Нужно уточнение.',...common};
  if(Array.isArray(r.actions)&&r.actions.length){
    const candidate={ok:true,type:'brain_batch',summary:r.summary||'',actions:r.actions,targetKey:routeState.aiTarget||TARGET.key,...common};
    const policyError=aiFieldSafeDraftError(candidate);
    return policyError?{ok:false,source:'brain',blocked:true,error:policyError,actions:[],...common}:candidate;
  }
  if(r.summary)return {ok:true,type:'read_answer',summary:r.summary,targetKey:routeState.aiTarget||TARGET.key,actions:[],...common};
  return {ok:false,error:'empty',...common};
};
window.parseAiCommand=()=>({ok:false,error:'no local fallback'});
window.aiBrainActionSummary=a=>a?.type==='add_work'?`Добавить работу ${a.work_name}`:String(a?.type||'action');
window.aiParseWorkAdd=text=>{
  const s=String(text||'');
  const m=s.match(/(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:м|метр(?:а|ов)?)\s+по\s+(\d+(?:[.,]\d+)?)/i);
  if(!m)return null;
  return {name:m[1].replace(/^.*?(?:добавь|добавить)\s+(?:ещ[её]\s+)?(?:работ[ау]?\s*:?\s*)?/i,''),qty:Number(m[2].replace(',','.')),unit:'м',price:Number(m[3].replace(',','.'))};
};
window.applyAiDraft=async function(){
  const d=window.aiDraft;
  if(!d?.ok)return;
  for(const a of d.actions||[]){
    if(a.type==='add_work'){
      const target=aiTargetByKey(`${a.object_id}|${a.order_id}`)||aiTargetByKey(d.targetKey)||TARGET;
      target.order.works.push({id:'e2e-added-'+target.order.works.length,name:a.work_name,qty:Number(a.qty),unit:a.unit,price:Number(a.price),progress_pct:0});
    }
  }
  window.aiDraft=null;
};
window.undoLastAiAction=()=>{};
window.requestAnimationFrame=fn=>setTimeout(fn,0);
</script>
<script src="../../ai-chat.js"></script>
<script src="../../ai-guard.js"></script>
<script>
(async()=>{
  const failures=[];
  const assert=(ok,msg)=>{if(!ok)failures.push(msg)};
  const waitFor=async(fn,ms=5000)=>{const end=Date.now()+ms;while(Date.now()<end){if(fn())return true;await new Promise(r=>setTimeout(r,25))}return false};
  const send=async text=>{
    const before=frameChatMessages().length;
    const input=document.getElementById('aiCommandInput');
    input.value=text;
    document.getElementById('aiAnalyzeBtn').click();
    await waitFor(()=>frameChatMessages().length>before&&!window.aiAnalyzing&&!window.frameThinking,5000);
  };
  try{
    render();
    frameSetTopic(TARGET.key);
    assert(!!document.getElementById('aiCommandInput'),'chat input missing');

    // 1. Apply a real add-work card through the visible chat controls.
    const startCount=ORDER.works.length;
    await send('Добавь ещё работу: штраба под кондиционер 6 метров по 800');
    const pending=await waitFor(()=>document.querySelector('[data-chat-apply]'));
    assert(pending,'apply button did not appear');
    assert(ORDER.works.length===startCount,'proposed action mutated the order before Apply');
    assert(frameChatMessages().some(m=>m.role==='user'&&/6 метров по 800/i.test(m.text||'')),'user message not persisted');
    assert(frameChatMessages().some(m=>m.status==='pending'),'pending action card not persisted');
    document.querySelector('[data-chat-apply]')?.click();
    const applied=await waitFor(()=>ORDER.works.length===startCount+1);
    assert(applied,'work was not applied to order');
    const work=ORDER.works[ORDER.works.length-1];
    assert(work?.qty===6,'applied quantity is not 6');
    assert(work?.price===800,'applied price is not 800');
    assert(work?.qty*work?.price===4800,'applied total is not 4800');
    await waitFor(()=>frameChatMessages().some(m=>m.status==='applied'));
    assert(/Применено/.test(document.body.textContent),'applied status not rendered in UI');

    // 2. Cancel a proposed action and prove the order is not mutated.
    const beforeCancel=ORDER.works.length;
    await send('Добавь ещё работу: демонтаж откоса 2 метра по 500');
    const cancelReady=await waitFor(()=>document.querySelector('[data-chat-cancel]'));
    assert(cancelReady,'cancel button did not appear');
    document.querySelector('[data-chat-cancel]')?.click();
    await waitFor(()=>frameChatMessages().some(m=>m.status==='cancelled'));
    assert(ORDER.works.length===beforeCancel,'cancelled action changed the order');
    assert(/Отменено/.test(document.body.textContent),'cancelled status not rendered in UI');

    // 3. A backend clarification is authoritative and can never become a local mutation.
    const coreLocalParser=window.parseAiCommand;
    let localParserCalls=0;
    window.parseAiCommand=(text,key)=>{localParserCalls++;return {ok:true,type:'work_complete',source:'local',targetKey:key||TARGET.key,rowId:'w-toilet',rowName:'Установка унитаза и кнопки',text,summary:'local mutation'};};
    BRAIN_REPLY={result:{actions:[],summary:'',needs_clarification:true,clarification:'Уточните, унитаз установлен полностью?'}};
    const clarificationStart=frameChatMessages().length;
    await send('Унитаз готов.');
    const clarificationRows=frameChatMessages().slice(clarificationStart);
    assert(localParserCalls===0,'backend clarification invoked local parser');
    assert(!clarificationRows.some(m=>m.status==='pending'),'backend clarification created a pending mutation');
    assert(clarificationRows.some(m=>m.role==='assistant'&&m.status==='done'&&/Уточните, унитаз установлен полностью/i.test(m.text||'')),'backend clarification was not shown');
    BRAIN_REPLY=null;
    window.parseAiCommand=coreLocalParser;

    // 4. Recent explicit correction must replace the older conflicting fact before the model call.
    frameSetTopic(TARGET.key);
    await send('Унитаз уже установлен.');
    await send('Нет, поправка: унитаз не установлен, я ошибся.');
    await send('Так унитаз сейчас установлен или нет?');
    const guarded=CAPTURED[CAPTURED.length-1]||'';
    assert(/унитаз не установлен/i.test(guarded),'latest correction missing from guarded request');
    assert(!/унитаз уже установлен/i.test(guarded),'superseded positive fact leaked into guarded request');
    assert(frameTopic()===TARGET.key,'correction flow changed active object');

    // 5. Explicit object name must switch the sticky conversation target.
    await send('По Веселковой 12Б что сейчас по работам?');
    assert(frameTopic()===TARGET2.key,'explicit object switch did not lock Веселковая');
    assert(routeState.aiTarget===TARGET2.key,'route target did not follow explicit object switch');
    await send('А по этому объекту что запланировано?');
    assert(frameTopic()===TARGET2.key,'pronoun follow-up lost the switched object');

    // 6. A unique work may switch target; a duplicated work name may not.
    frameSetTopic(TARGET.key);
    const uniqueWorkText='Монтаж душевого поддона поставь на 65 процентов';
    assert(frameDetectTarget(uniqueWorkText)===TARGET2.key,'unique work name did not resolve Веселковая');
    await send(uniqueWorkText);
    assert(frameTopic()===TARGET2.key&&routeState.aiTarget===TARGET2.key,'unique work name did not switch sticky target');

    const tiedWorkText='Гидроизоляция стен готова на 50 процентов';
    assert(frameDetectTarget(tiedWorkText)==='','duplicate work name resolved despite a tie');
    await send(tiedWorkText);
    assert(frameTopic()===TARGET2.key&&routeState.aiTarget===TARGET2.key,'tied work name switched away from current target');

    // 7. An add-work command must stay on the active object unless an object is explicit.
    frameSetTopic(TARGET.key);
    const addNamedLikeExisting='Добавь работу: монтаж душевого поддона 1 метр по 1000';
    assert(frameDetectTarget(addNamedLikeExisting)==='','add-work command switched by an existing work name');
    await send(addNamedLikeExisting);
    assert(frameTopic()===TARGET.key&&routeState.aiTarget===TARGET.key,'add-work command left the active object');
    document.querySelector('[data-chat-cancel]')?.click();
    assert(frameDetectTarget('По Веселковой 12Б добавь работу: откос 1 метр по 1000')===TARGET2.key,'explicit object did not switch add-work target');
    // 8. field_safe rejects a mixed batch before it can create an Apply card.
    const safetyStart=ORDER.works.length;
    BRAIN_REPLY={meta:{mode:'field_safe'},result:{summary:'mixed',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Безопасная работа',qty:1,unit:'компл.',price:1000},
      {type:'add_payment',object_id:OBJECT.id,order_id:ORDER.id,amount:5000}
    ]}};
    await send('Проверь смешанный пакет');
    assert(!document.querySelector('[data-chat-apply]'),'field_safe mixed batch exposed Apply');
    assert(!frameChatMessages().some(m=>m.status==='pending'&&m.draft?.mode==='field_safe'),'field_safe mixed batch was persisted');
    assert(ORDER.works.length===safetyStart,'field_safe mixed batch mutated work data');
    assert(/Ничего не применено/i.test(document.body.textContent),'field_safe block was not explained');

    // 9. A permitted field_safe action still requires one explicit Apply.
    BRAIN_REPLY={meta:{mode:'field_safe',confirmation_required:true},result:{summary:'safe',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Полевой тест',qty:1,unit:'компл.',price:1000}
    ]}};
    await send('Подготовь разрешённую полевую работу');
    assert(!!document.querySelector('[data-chat-apply]'),'allowed field_safe action has no Apply');
    assert(ORDER.works.length===safetyStart,'allowed field_safe action applied without tap');
    assert(frameRestorePending()?.mode==='field_safe','field_safe mode was lost from pending draft');
    const safeApply=document.querySelector('[data-chat-apply]');
    safeApply?.click();
    safeApply?.click();
    await waitFor(()=>ORDER.works.length===safetyStart+1);
    assert(ORDER.works.length===safetyStart+1,'allowed field_safe action was not applied exactly once');

    // 10. A valid action aimed at another object is blocked before confirmation.
    frameSetTopic(TARGET.key);
    BRAIN_REPLY={meta:{mode:'field_safe'},result:{summary:'wrong target',actions:[
      {type:'set_work_progress',object_id:OBJECT2.id,order_id:ORDER2.id,work_id:'w-shower',progress_pct:65}
    ]}};
    await send('Проверь чужую цель');
    assert(!document.querySelector('[data-chat-apply]'),'cross-target field action exposed Apply');
    assert(/цель ответа не совпала/i.test(document.body.textContent),'cross-target field action was not explained');

    // 11. Candidate mode remains backward compatible, but is not applied in this test.
    BRAIN_REPLY={meta:{mode:'candidate'},result:{summary:'candidate mixed',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Черновик',qty:1,unit:'компл.',price:1000},
      {type:'add_payment',object_id:OBJECT.id,order_id:ORDER.id,amount:5000}
    ]}};
    await send('Проверь candidate пакет');
    assert(!!document.querySelector('[data-chat-apply]'),'candidate batch was incorrectly blocked by field policy');
    document.querySelector('[data-chat-cancel]')?.click();
    BRAIN_REPLY=null;
  }catch(e){failures.push('exception: '+(e?.stack||e))}
  document.getElementById('result').textContent=failures.length
    ? `FRAME_UI_E2E_FAIL\n${failures.join('\n')}`
    : 'FRAME_UI_E2E_PASS';
})();
</script>
</body></html>
