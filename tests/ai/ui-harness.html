<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>FRAME UI E2E Harness</title></head>
<body><div id="app"></div><pre id="result">RUNNING</pre>
<script>
const STORE={
  frameAiChatV270:JSON.stringify([{id:'persisted-old',at:'2026-01-01T00:00:00.000Z',role:'user',status:'done',text:'Старый личный разговор про ужин'}]),
  frameAiPendingV270:JSON.stringify({ok:true,type:'payment',amount:99999}),
  frameAiTopicV270:'obj-ves|order-ves',
  frameAiLogV240:'business-audit-must-survive'
};
window.CAPTURED=[];
window.FRAME_AI_TEST_ALLOW_SYNTHETIC_APPLY=true;
window.LAST_AUTHORIZATION='';
let BRAIN_REPLY=null;
window.storageGet=(k,d='')=>Object.prototype.hasOwnProperty.call(STORE,k)?STORE[k]:d;
window.storageSet=(k,v)=>{STORE[k]=String(v)};
window.storageRemove=k=>{delete STORE[k]};
window.uid=()=> 'id-'+Math.random().toString(36).slice(2);
window.now=()=> new Date().toISOString();
window.$=id=>document.getElementById(id);
window.$$=sel=>Array.from(document.querySelectorAll(sel));
window.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.toast=()=>{};
window.openSheet=()=>{};
window.render=()=>{if(route==='ai'&&typeof frameLeaveAi==='function')frameLeaveAi();document.getElementById('app').innerHTML=renderAiView();bindAiView()};
window.route='ai';
window.routeState={aiTarget:'obj-arch|order-arch'};
window.aiDraft=null;
window.aiAnalyzing=false;
window.aiRecognition=null;
window.aiBrainStatus={ok:true};
window.checkAiBrain=async()=>({ok:true});
window.renderAiView=()=> '';
window.analyzeAiInput=async()=>{};
window.startAiVoice=()=>{};
window.bindAiResult=()=>{};
window.bindAiView=()=>{};
window.aiNorm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
window.aiTokens=s=>window.aiNorm(s).split(/[^a-zа-я0-9]+/i).filter(Boolean);
window.aiStem=s=>window.aiNorm(s).slice(0,6);
window.parseNum=v=>Number(String(v??'').replace(',','.').replace(/[^0-9.\-]/g,''))||0;
window.money=v=>`${Number(v||0).toLocaleString('ru-RU')} ₽`;

const ORDER={id:'order-arch',title:'Ремонт квартиры',works:[
  {id:'w-install',name:'Монтаж инсталляции',qty:1,unit:'компл.',price:10000,progress_pct:100},
  {id:'w-toilet',name:'Установка унитаза и кнопки',qty:1,unit:'компл.',price:3000,progress_pct:0},
  {id:'w-shared-arch',name:'Гидроизоляция стен',qty:1,unit:'компл.',price:5000,progress_pct:0}
]};
const OBJECT={id:'obj-arch',contact:{address:'Архангельская, 21',name:'Заказчик'},orders:[ORDER]};
const TARGET={key:'obj-arch|order-arch',object:OBJECT,order:ORDER};

const ORDER2={id:'order-ves',title:'Сантехнические работы',works:[
  {id:'w-water',name:'Вода и канализация',qty:1,unit:'компл.',price:35000,progress_pct:0},
  {id:'w-shower',name:'Монтаж душевого поддона',qty:1,unit:'компл.',price:12000,progress_pct:0},
  {id:'w-shared-ves',name:'Гидроизоляция стен',qty:1,unit:'компл.',price:5000,progress_pct:0}
]};
const OBJECT2={id:'obj-ves',contact:{address:'Веселковая, 12Б',name:'Офис'},orders:[ORDER2]};
const TARGET2={key:'obj-ves|order-ves',object:OBJECT2,order:ORDER2};
const TARGETS=[TARGET,TARGET2];

window.aiDefaultTargetKey=()=>TARGET.key;
window.aiTargetByKey=key=>TARGETS.find(x=>x.key===key)||null;
window.aiAllTargets=()=>TARGETS;
window.aiFindWork=(order,text)=>{const tokens=aiTokens(text);let best=null,bestScore=0;for(const row of order?.works||[]){const name=aiNorm(row.name),nameTokens=aiTokens(name);let score=0;for(const token of tokens){if(name.includes(token))score+=3;else if(nameTokens.some(n=>n.startsWith(token)||token.startsWith(n)))score+=2}if(score>bestScore){best=row;bestScore=score}}return bestScore>=2?best:null};
window.aiContextPayload=()=>({current_target:routeState.aiTarget||TARGET.key,objects:TARGETS.map(t=>({id:t.object.id,address:t.object.contact.address,orders:[{id:t.order.id,title:t.order.title,works:t.order.works}]}))});
let TEST_SERVER_URL='http://127.0.0.1:8787/frame-field',TEST_SERVER_TOKEN='test-auth-token';
window.aiServerUrl=()=>TEST_SERVER_URL;
window.aiServerToken=()=>TEST_SERVER_TOKEN;
window.aiBrainFetch=async()=>({ok:true,provider:'test',model:'test'});
let BRAIN_HANDLER=null;
function defaultBrainReply(text){const parsed=aiParseWorkAdd(text);if(parsed&&parseNum(parsed.price)>0){const target=aiTargetByKey(routeState.aiTarget)||TARGET;return {result:{summary:'provider add work',actions:[{type:'add_work',object_id:target.object.id,order_id:target.order.id,work_name:parsed.name,qty:parsed.qty,unit:parsed.unit,price:parsed.price}]}}}return {result:{actions:[],summary:'stub'}}}
window.requestAiBrain=async text=>{const context=aiContextPayload();CAPTURED.push({text:String(text||''),context});return BRAIN_HANDLER?BRAIN_HANDLER(String(text||''),context):(BRAIN_REPLY||defaultBrainReply(String(text||'')))};
window.parseAiCommand=()=>({ok:false,error:'no local fallback'});
window.aiBrainActionSummary=a=>a?.type==='add_work'?`Добавить работу ${a.work_name}`:String(a?.type||'action');
window.aiParseWorkAdd=text=>{
  const s=String(text||'');
  const m=s.match(/(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:м|метр(?:а|ов)?)\s+по\s+(\d+(?:[.,]\d+)?)/i);
  if(!m)return null;
  return {name:m[1].replace(/^.*?(?:добавь|добавить)\s+(?:ещ[её]\s+)?(?:работ[ау]?\s*:?\s*)?/i,''),qty:Number(m[2].replace(',','.')),unit:'м',price:Number(m[3].replace(',','.'))};
};
window.applyAiDraft=async function(authorizationToken=''){
  const d=window.aiDraft;
  window.LAST_AUTHORIZATION=authorizationToken;
  if(!d?.ok||!aiConsumeAuthorizedDraft(d,authorizationToken).ok)return false;
  for(const a of d.actions||[]){
    if(a.type==='add_work'){
      const target=aiTargetByKey(`${a.object_id}|${a.order_id}`)||aiTargetByKey(d.targetKey)||TARGET;
      target.order.works.push({id:'e2e-added-'+target.order.works.length,name:a.work_name,qty:Number(a.qty),unit:a.unit,price:Number(a.price),progress_pct:0});
    }
  }
  window.aiDraft=null;
  return true;
};
window.undoLastAiAction=()=>{};
window.requestAnimationFrame=fn=>setTimeout(fn,0);
window.WAKE_REQUESTS=0;
window.WAKE_RELEASES=0;
window.WAKE_OUTSTANDING=0;
try{Object.defineProperty(navigator,'wakeLock',{configurable:true,value:{request:async()=>{WAKE_REQUESTS++;WAKE_OUTSTANDING++;let released=false;return {addEventListener:()=>{},release:async()=>{if(!released){released=true;WAKE_RELEASES++;WAKE_OUTSTANDING--}}}}}})}catch(e){}
</script>
<script src="../../ai-safety.js"></script>
<script>
aiRecordAuthenticatedHealth('field_safe',{url:aiServerUrl(),authenticated:true});
window.brainDraftFromResponse=(text,response)=>{const key=routeState.aiTarget||TARGET.key;return aiSafeDraftFromResponse(text,response,key,frameTargetLabel(key))};
</script>
<script src="../../ai-chat.js"></script>
<script src="../../ai-guard.js"></script>
<script>
(async()=>{
  const failures=[];
  const assert=(ok,msg)=>{if(!ok)failures.push(msg)};
  const waitFor=async(fn,ms=5000)=>{const end=Date.now()+ms;while(Date.now()<end){if(fn())return true;await new Promise(r=>setTimeout(r,25))}return false};
  const send=async text=>{
    const before=frameChatMessages().length;
    const input=document.getElementById('aiCommandInput');
    input.value=text;
    document.getElementById('aiAnalyzeBtn').click();
    await waitFor(()=>frameChatMessages().length>before&&!window.aiAnalyzing&&!window.frameThinking,5000);
  };
  try{
    render();
    frameSetTopic(TARGET.key);
    assert(!!document.getElementById('aiCommandInput'),'chat input missing');
    assert(!/Старый личный разговор про ужин/i.test(document.getElementById('app').textContent),'legacy durable chat was restored into the new page session');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiChatV270'),'legacy transcript key was not retired');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiPendingV270'),'legacy pending-draft key was not retired');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiTopicV270'),'legacy topic key was not retired');
    assert(STORE.frameAiLogV240==='business-audit-must-survive','business AI audit was deleted with chat memory');
    const privateWords='личный разговор';
    const cleanAudit=aiSanitizeAuditEntries([{id:'audit-1',type:'brain_batch',actionTypes:['add_work'],targetKey:TARGET.key,summary:privateWords,text:privateWords,provider:privateWords,model:privateWords,draft:{secret:true},unexpected:privateWords,undo:{kind:'batch_v250',ops:[]}}]);
    assert(cleanAudit[0].id==='audit-1'&&/Новая работа/.test(cleanAudit[0].summary)&&cleanAudit[0].undo?.kind==='batch_v250','audit sanitizer deleted structured construction audit');
    assert(!JSON.stringify(cleanAudit).includes(privateWords)&&!('draft' in cleanAudit[0])&&!('provider' in cleanAudit[0])&&!('model' in cleanAudit[0])&&!('unexpected' in cleanAudit[0]),'audit sanitizer retained provider-controlled durable text');
    aiRecordAuthenticatedHealth('candidate',{url:aiServerUrl(),authenticated:true});
    const unverifiedDraft=aiSafeDraftFromResponse('probe',{result:{summary:'probe',actions:[{type:'add_note',object_id:OBJECT.id,order_id:ORDER.id,note:'probe'}]}},TARGET.key,'Архангельская, 21 · Ремонт квартиры');
    assert(!unverifiedDraft.ok&&unverifiedDraft.blocked,'field mutation was accepted without authenticated field_safe health mode');
    aiRecordAuthenticatedHealth('field_safe',{url:aiServerUrl(),authenticated:true});
    const immediateHealthFetch=window.aiBrainFetch;
    let resolveOldHealth;
    window.aiBrainFetch=()=>new Promise(resolve=>{resolveOldHealth=resolve});
    TEST_SERVER_TOKEN='token-A';
    aiBrainStatus=null;
    const staleHealth=checkAiBrain({toastResult:false});
    TEST_SERVER_TOKEN='token-B';
    resolveOldHealth({ok:true,mode:'field_safe',provider:'stale'});
    await staleHealth;
    assert(!aiFieldSafeHealthVerified(),'late health response authenticated a different current token');
    window.aiBrainFetch=immediateHealthFetch;
    aiRecordAuthenticatedHealth('field_safe',{url:aiServerUrl(),authenticated:true});
    aiBrainStatus={ok:true,mode:'field_safe'};
    await new Promise(r=>setTimeout(r,25));
    assert(WAKE_REQUESTS===0&&WAKE_OUTSTANDING===0,'render acquired a wake lock without focused composer or voice');
    const composer=document.getElementById('aiCommandInput');
    composer.focus();
    composer.dispatchEvent(new Event('input',{bubbles:true}));
    await waitFor(()=>WAKE_REQUESTS>0,1000);
    assert(WAKE_REQUESTS===1&&WAKE_OUTSTANDING===1,'focused composer did not hold exactly one screen wake lock');
    const releasesBeforeMicError=WAKE_RELEASES;
    window.SpeechRecognition=function(){this.start=()=>{};this.abort=()=>{}};
    frameVoiceWanted=true;
    frameStartRecognition();
    aiRecognition?.onerror?.({error:'not-allowed'});
    await new Promise(r=>setTimeout(r,25));
    assert(WAKE_RELEASES===releasesBeforeMicError&&WAKE_OUTSTANDING===1,'mic error released wake lock while keyboard composer remained focused');
    delete window.SpeechRecognition;
    try{Object.defineProperty(window,'SpeechRecognition',{configurable:true,writable:true,value:undefined})}catch(e){window.SpeechRecognition=undefined}
    try{Object.defineProperty(window,'webkitSpeechRecognition',{configurable:true,writable:true,value:undefined})}catch(e){window.webkitSpeechRecognition=undefined}
    composer.blur();
    await waitFor(()=>WAKE_RELEASES>0,1000);
    assert(WAKE_OUTSTANDING===0,'screen wake lock was not fully released after composer blur');
    composer.focus();
    await waitFor(()=>WAKE_OUTSTANDING===1,1000);
    let routeVoiceAborted=false;
    frameVoiceWanted=true;
    aiRecognition={abort:()=>{routeVoiceAborted=true}};
    frameLeaveAi();
    await waitFor(()=>WAKE_OUTSTANDING===0,1000);
    assert(routeVoiceAborted&&aiRecognition===null,'leaving AI route did not stop active recognition');
    assert(WAKE_OUTSTANDING===0&&!frameComposerWakeWanted&&!frameVoiceWanted,'leaving AI route retained wake intent or lock');
    composer.blur();
    await startAiVoice();
    await waitFor(()=>WAKE_OUTSTANDING===0,1000);
    assert(!frameVoiceWanted&&WAKE_OUTSTANDING===0,'unsupported speech API left voice wake intent active');
    await send('Проверка контекста текущей сессии');
    const sessionCall=CAPTURED[CAPTURED.length-1]||{};
    const providerConversation=sessionCall.context?.conversation||[];
    assert(providerConversation.some(m=>/Проверка контекста текущей сессии/i.test(m.content||'')),'current-session message missing from provider context');
    assert(!providerConversation.some(m=>/Старый личный разговор про ужин/i.test(m.content||'')),'retired personal chat leaked into provider context');

    // 1. Apply a real add-work card through the visible chat controls.
    const startCount=ORDER.works.length;
    await send('Добавь ещё работу: штраба под кондиционер 6 метров по 800');
    const pending=await waitFor(()=>document.querySelector('[data-chat-apply]'));
    assert(pending,'apply button did not appear');
    assert(ORDER.works.length===startCount,'proposed action mutated the order before Apply');
    assert(frameChatMessages().some(m=>m.role==='user'&&/6 метров по 800/i.test(m.text||'')),'user message missing from page session');
    assert(frameChatMessages().some(m=>m.status==='pending'),'pending action card missing from page session');
    const directResult=await applyAiDraft();
    assert(directResult===false,'direct executor invocation without Apply authorization was accepted');
    assert(ORDER.works.length===startCount,'direct executor invocation mutated the order');
    FRAME_AI_TEST_ALLOW_SYNTHETIC_APPLY=false;
    document.querySelector('[data-chat-apply]')?.click();
    await new Promise(r=>setTimeout(r,25));
    assert(ORDER.works.length===startCount,'programmatic Apply click was accepted as human confirmation');
    FRAME_AI_TEST_ALLOW_SYNTHETIC_APPLY=true;
    document.querySelector('[data-chat-apply]')?.click();
    const applied=await waitFor(()=>ORDER.works.length===startCount+1);
    assert(applied,'work was not applied to order');
    const work=ORDER.works[ORDER.works.length-1];
    assert(work?.qty===6,'applied quantity is not 6');
    assert(work?.price===800,'applied price is not 800');
    assert(work?.qty*work?.price===4800,'applied total is not 4800');
    await waitFor(()=>frameChatMessages().some(m=>m.status==='applied'));
    assert(/Применено/.test(document.body.textContent),'applied status not rendered in UI');

    // 2. Cancel a proposed action and prove the order is not mutated.
    const beforeCancel=ORDER.works.length;
    await send('Добавь ещё работу: демонтаж откоса 2 метра по 500');
    const cancelReady=await waitFor(()=>document.querySelector('[data-chat-cancel]'));
    assert(cancelReady,'cancel button did not appear');
    document.querySelector('[data-chat-cancel]')?.click();
    await waitFor(()=>frameChatMessages().some(m=>m.status==='cancelled'));
    assert(ORDER.works.length===beforeCancel,'cancelled action changed the order');
    assert(/Отменено/.test(document.body.textContent),'cancelled status not rendered in UI');

    // 3. A backend clarification is authoritative and can never become a local mutation.
    const coreLocalParser=window.parseAiCommand;
    let localParserCalls=0;
    window.parseAiCommand=(text,key)=>{localParserCalls++;return {ok:true,type:'work_complete',source:'local',targetKey:key||TARGET.key,rowId:'w-toilet',rowName:'Установка унитаза и кнопки',text,summary:'local mutation'};};
    BRAIN_REPLY={result:{actions:[],summary:'',needs_clarification:true,clarification:'Уточните, унитаз установлен полностью?'}};
    const clarificationStart=frameChatMessages().length;
    await send('Унитаз готов.');
    const clarificationRows=frameChatMessages().slice(clarificationStart);
    assert(localParserCalls===0,'backend clarification invoked local parser');
    assert(!clarificationRows.some(m=>m.status==='pending'),'backend clarification created a pending mutation');
    assert(clarificationRows.some(m=>m.role==='assistant'&&m.status==='done'&&/Уточните, унитаз установлен полностью/i.test(m.text||'')),'backend clarification was not shown');
    BRAIN_REPLY=null;
    window.parseAiCommand=coreLocalParser;

    // 4. Current text stays raw; reconciled corrections travel in structured context only.
    frameSetTopic(TARGET.key);
    await send('Унитаз уже установлен.');
    await send('Нет, поправка: унитаз не установлен, я ошибся.');
    await send('Так унитаз сейчас установлен или нет?');
    const correctionCall=CAPTURED[CAPTURED.length-1]||{};
    const correctionFacts=(correctionCall.context?.recent_user_facts||[]).join('\n');
    assert(correctionCall.text==='Так унитаз сейчас установлен или нет?','current request was not sent as raw text');
    assert(!/FRAME INTERNAL CONTEXT/i.test(correctionCall.text||''),'internal context leaked into current text');
    assert(/унитаз не установлен/i.test(correctionFacts),'latest correction missing from structured context');
    assert(!/унитаз уже установлен/i.test(correctionFacts),'superseded positive fact leaked into structured context');
    assert(frameTopic()===TARGET.key,'correction flow changed active object');

    // 5. A previous 50% statement must not turn the next money question into a repeated mutation.
    BRAIN_HANDLER=text=>{
      if(/50\s*(?:%|процент)/i.test(text)&&/выполн/i.test(text))return {result:{summary:'Прогресс 50%.',actions:[
        {type:'set_work_progress',object_id:OBJECT.id,order_id:ORDER.id,work_id:'w-install',progress_pct:50}
      ]}};
      return {result:{summary:'Выполнено на 15 000 ₽.',actions:[]}};
    };
    await send('По электромонтажным работам выполнено примерно 50 процентов.');
    assert(!!document.querySelector('[data-chat-apply]'),'current 50% statement did not produce the test mutation');
    await send('На какую сумму выполнена электрика?');
    const moneyCall=CAPTURED[CAPTURED.length-1]||{};
    const moneyRows=frameChatMessages().slice(-2);
    assert(moneyCall.text==='На какую сумму выполнена электрика?','previous progress statement leaked into current question');
    assert((moneyCall.context?.recent_user_facts||[]).some(x=>/50\s*процент/i.test(x)),'previous progress fact missing from structured context');
    assert(!document.querySelector('[data-chat-apply]'),'read-only money question repeated the previous mutation');
    assert(moneyRows.some(m=>m.role==='assistant'&&m.status==='done'&&/15\s*000/.test(m.text||'')),'read-only money answer was not rendered');
    BRAIN_HANDLER=null;

    // 6. Explicit object name must switch the sticky conversation target.
    await send('По Веселковой 12Б что сейчас по работам?');
    assert(frameTopic()===TARGET2.key,'explicit object switch did not lock Веселковая');
    assert(routeState.aiTarget===TARGET2.key,'route target did not follow explicit object switch');
    await send('А по этому объекту что запланировано?');
    assert(frameTopic()===TARGET2.key,'pronoun follow-up lost the switched object');

    // 7. A unique work may switch target; a duplicated work name may not.
    frameSetTopic(TARGET.key);
    const uniqueWorkText='Монтаж душевого поддона поставь на 65 процентов';
    assert(frameDetectTarget(uniqueWorkText)===TARGET2.key,'unique work name did not resolve Веселковая');
    await send(uniqueWorkText);
    assert(frameTopic()===TARGET2.key&&routeState.aiTarget===TARGET2.key,'unique work name did not switch sticky target');

    const tiedWorkText='Гидроизоляция стен готова на 50 процентов';
    assert(frameDetectTarget(tiedWorkText)==='','duplicate work name resolved despite a tie');
    await send(tiedWorkText);
    assert(frameTopic()===TARGET2.key&&routeState.aiTarget===TARGET2.key,'tied work name switched away from current target');

    // 8. An add-work command must stay on the active object unless an object is explicit.
    frameSetTopic(TARGET.key);
    const addNamedLikeExisting='Добавь работу: монтаж душевого поддона 1 метр по 1000';
    assert(frameDetectTarget(addNamedLikeExisting)==='','add-work command switched by an existing work name');
    await send(addNamedLikeExisting);
    assert(frameTopic()===TARGET.key&&routeState.aiTarget===TARGET.key,'add-work command left the active object');
    document.querySelector('[data-chat-cancel]')?.click();
    assert(frameDetectTarget('По Веселковой 12Б добавь работу: откос 1 метр по 1000')===TARGET2.key,'explicit object did not switch add-work target');
    // 9. /frame-field pins field_safe locally even when provider metadata is missing.
    const safetyStart=ORDER.works.length;
    BRAIN_REPLY={result:{summary:'mixed',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Безопасная работа',qty:1,unit:'компл.',price:1000},
      {type:'add_payment',object_id:OBJECT.id,order_id:ORDER.id,amount:5000}
    ]}};
    await send('Проверь смешанный пакет');
    assert(!document.querySelector('[data-chat-apply]'),'field_safe mixed batch exposed Apply');
    assert(!frameChatMessages().some(m=>m.status==='pending'&&m.draft?.mode==='field_safe'),'field_safe mixed batch entered pending session state');
    assert(ORDER.works.length===safetyStart,'field_safe mixed batch mutated work data');
    assert(/Ничего не применено/i.test(document.body.textContent),'field_safe block was not explained');

    // 10. A permitted field_safe action still requires one explicit Apply.
    BRAIN_REPLY={meta:{mode:'candidate',confirmation_required:false},result:{summary:'safe',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Полевой тест',qty:1,unit:'компл.',price:1000}
    ]}};
    await send('Подготовь разрешённую полевую работу');
    assert(!!document.querySelector('[data-chat-apply]'),'allowed field_safe action has no Apply');
    assert(ORDER.works.length===safetyStart,'allowed field_safe action applied without tap');
    assert(frameRestorePending()?.mode==='field_safe','field_safe mode was lost from pending draft');
    const safeDraft=frameRestorePending();
    assert(safeDraft?.mode==='field_safe','provider metadata downgraded locally pinned field mode');
    assert(safeDraft?.targetLabel==='Архангельская, 21 · Ремонт квартиры','field_safe draft has no immutable target snapshot');
    assert(/Объект:\s*Архангельская, 21\s*·\s*Ремонт квартиры/i.test(document.body.textContent),'field_safe target is not visible in preview');
    const safeApply=document.querySelector('[data-chat-apply]');
    document.getElementById('aiCommandInput')?.focus();
    await waitFor(()=>WAKE_OUTSTANDING===1,1000);
    safeApply?.click();
    safeApply?.click();
    await waitFor(()=>ORDER.works.length===safetyStart+1);
    assert(ORDER.works.length===safetyStart+1,'allowed field_safe action was not applied exactly once');
    await waitFor(()=>WAKE_OUTSTANDING===0,1000);
    assert(WAKE_OUTSTANDING===0&&!frameComposerWakeWanted,'same-route Apply render retained composer wake lock');
    window.aiDraft=safeDraft;
    const replayResult=await frameCoreApplyAiDraft(LAST_AUTHORIZATION);
    window.aiDraft=null;
    assert(replayResult===false,'consumed Apply authorization was replayable');
    assert(ORDER.works.length===safetyStart+1,'authorization replay applied the draft twice');

    // 11. A valid action aimed at another object is blocked before confirmation.
    frameSetTopic(TARGET.key);
    BRAIN_REPLY={meta:{mode:'field_safe'},result:{summary:'wrong target',actions:[
      {type:'set_work_progress',object_id:OBJECT2.id,order_id:ORDER2.id,work_id:'w-shower',progress_pct:65}
    ]}};
    await send('Проверь чужую цель');
    assert(!document.querySelector('[data-chat-apply]'),'cross-target field action exposed Apply');
    assert(/цель ответа не совпала/i.test(document.body.textContent),'cross-target field action was not explained');

    // 12. Malicious candidate metadata cannot downgrade /frame-field or expose payment Apply.
    BRAIN_REPLY={meta:{mode:'candidate'},result:{summary:'candidate mixed',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Черновик',qty:1,unit:'компл.',price:1000},
      {type:'add_payment',object_id:OBJECT.id,order_id:ORDER.id,amount:5000}
    ]}};
    await send('Проверь candidate пакет');
    assert(!document.querySelector('[data-chat-apply]'),'provider candidate metadata bypassed local field policy');

    // 13. Any post-display draft change invalidates the exact authorization signature.
    BRAIN_REPLY={result:{summary:'tamper test',actions:[
      {type:'add_work',object_id:OBJECT.id,order_id:ORDER.id,work_name:'Неизменяемый план',qty:1,unit:'компл.',price:1000}
    ]}};
    const tamperStart=ORDER.works.length;
    await send('Подготовь проверку подписи');
    const tamperDraft=frameRestorePending(),tamperApply=document.querySelector('[data-chat-apply]');
    assert(!!tamperDraft&&!!tamperApply,'signature test plan was not displayed');
    tamperDraft.actions[0].price=777777;
    tamperApply?.click();
    await new Promise(r=>setTimeout(r,50));
    assert(ORDER.works.length===tamperStart,'modified displayed draft passed exact authorization');
    frameCancelPending(tamperDraft.chatId);

    // Session traffic must never recreate retired durable AI chat keys.
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiChatV270'),'session transcript was written to durable storage');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiPendingV270'),'session draft was written to durable storage');
    assert(!Object.prototype.hasOwnProperty.call(STORE,'frameAiTopicV270'),'session target was written to durable storage');
    assert(STORE.frameAiLogV240==='business-audit-must-survive','business audit changed during chat-key retirement');
    BRAIN_REPLY=null;
  }catch(e){failures.push('exception: '+(e?.stack||e))}
  document.getElementById('result').textContent=failures.length
    ? `FRAME_UI_E2E_FAIL\n${failures.join('\n')}`
    : 'FRAME_UI_E2E_PASS';
})();
</script>
