<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Обновление FRAME</title>
<style>body{margin:0;background:#0f1113;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.card{max-width:460px;background:#181b1f;border:1px solid #343a40;border-radius:24px;padding:28px;text-align:center}h1{margin:0 0 12px}.muted{color:#abb0b5;line-height:1.5}.bar{height:9px;background:#2b3035;border-radius:99px;overflow:hidden;margin:22px 0}.fill{height:100%;width:15%;background:#c47b34;animation:load 1.3s ease forwards}@keyframes load{to{width:100%}}button{border:0;border-radius:14px;padding:14px 18px;background:#c47b34;color:#fff;font-size:17px;font-weight:800}</style></head>
<body><div class="card"><div style="font-size:48px">🔄</div><h1>Обновляем FRAME</h1><p class="muted" id="status">Обновляем файлы приложения. Объекты и настройки останутся на устройстве.</p><div class="bar"><div class="fill"></div></div><button id="manual" hidden>Открыть FRAME 2.2.0</button></div>
<script>(async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));document.getElementById('status').textContent='Готово. Открываем FRAME 2.2.0…';setTimeout(()=>location.replace('./index.html?fresh=220&ts='+Date.now()),700)}catch(e){document.getElementById('status').textContent='Автоматическое обновление не сработало. Нажмите кнопку.';const b=document.getElementById('manual');b.hidden=false;b.onclick=()=>location.replace('./index.html?fresh=220&ts='+Date.now())}})();</script></body></html>
