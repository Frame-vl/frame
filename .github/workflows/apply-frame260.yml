name: Apply FRAME 2.6.0

on:
  push:
    paths:
      - '.frame-deploy/frame260.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply FRAME 2.6.0
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .frame-deploy/apply260.py.gz.b64 > /tmp/apply260.py.gz
          gzip -dc /tmp/apply260.py.gz > /tmp/apply260.py
          python - <<'PY'
          from pathlib import Path
          import ast, re
          src=Path('/tmp/apply260.py').read_text(encoding='utf-8')
          m=re.search(r'OPS=(.*)\nfor f,ops in OPS:',src,re.S)
          if not m: raise SystemExit('OPS payload not found')
          payload=ast.literal_eval(m.group(1))
          for f,ops in payload:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              for tag,old,new in ops:
                  if tag!='insert':
                      if old not in s: raise SystemExit(f'pattern missing in {f}')
                      s=s.replace(old,new,1)
                      continue
                  if f=='app.js' and new.startswith("const SOLO260_DATA_KEY"):
                      anchor="const AI_LOG_KEY='frameAiLogV240';\n"
                      s=s.replace(anchor,anchor+new,1)
                  elif f=='app.js' and "reimburse_purchase" in new:
                      anchor="      if(kind==='add_purchase'){\n"
                      s=s.replace(anchor,new+anchor,1)
                  elif f=='app.js' and new.startswith('function daysSince'):
                      anchor='function monthGoal(){'
                      i=s.index(anchor); s=s[:i]+new+s[i:]
                  elif f=='app.js' and new.startswith('function renderSystemSettings'):
                      anchor='function renderBackupSettings()'
                      i=s.index(anchor); s=s[:i]+new+s[i:]
                  elif f=='app.js' and new.startswith('async function patchV260SoloFieldTest'):
                      anchor="window.addEventListener('beforeunload'"
                      i=s.index(anchor); s=s[:i]+new+s[i:]
                  elif f=='app.js' and 'await patchV260SoloFieldTest' in new:
                      anchor='    await patchV230CurrentData();\n'
                      s=s.replace(anchor,anchor+new,1)
                  elif f in ('styles.css','FRAME_CONTEXT_PASSPORT.md'):
                      s=s+new
                  elif f in ('CHANGELOG.txt','ROADMAP.md','TEST_REPORT.txt','README.txt'):
                      s=new+s
                  else:
                      raise SystemExit(f'unhandled insert in {f}: {new[:80]}')
              p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          node --check sw.js
          grep -q "const VERSION='2.6.0'" app.js
          grep -q "Требует внимания" app.js
          grep -q "frame-v260-solo-field" sw.js
          rm -rf .frame-deploy
          rm -f .github/workflows/apply-frame260.yml
          git config user.name "FRAME Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "FRAME 2.6.0 Solo Field Test"
          git push
