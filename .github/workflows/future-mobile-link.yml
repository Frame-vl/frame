name: FUTURE Mobile Link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'future/**'
      - '.github/workflows/future-mobile-link.yml'

permissions:
  contents: read

concurrency:
  group: future-mobile-link
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify protected FUTURE backend address
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\DEV\Director\future-pilot'
          $urlPath=Join-Path $root 'public-url.txt'
          $url=if(Test-Path -LiteralPath $urlPath){(Get-Content -LiteralPath $urlPath -Raw -Encoding UTF8).Trim()}else{''}
          if(-not $url){throw 'FUTURE stable Funnel URL is missing'}
          $h=Invoke-RestMethod -Uri ($url+'/api/health') -TimeoutSec 30
          if(-not $h.ok -or -not $h.protected){throw 'FUTURE stable Funnel is unhealthy'}
          Write-Host 'FUTURE_MOBILE_BACKEND_HEALTHY=true'
