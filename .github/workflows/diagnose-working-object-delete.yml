name: FRAME diagnose working object delete
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-working-object-delete.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Probe 2.8.14 working routes without touching IndexedDB
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          function Probe($label,$url){
            $tmp=Join-Path $env:RUNNER_TEMP ('route-'+[guid]::NewGuid().ToString('N'))
            try{
              Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tmp -Headers @{'Cache-Control'='no-cache'} -ErrorAction Stop
              $text=Get-Content $tmp -Raw
              [pscustomobject]@{label=$label;url=$url;ok=$true;sha=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower();bytes=(Get-Item $tmp).Length;has_2814=($text -match '2\.8\.14|2814');has_helper=($text -match 'frameDeleteObjectFromChat');has_gate=($text -match 'frameObjectDeleteApplyDecision')}
            }catch{
              $status=$null;try{$status=[int]$_.Exception.Response.StatusCode}catch{}
              [pscustomobject]@{label=$label;url=$url;ok=$false;status=$status;error=$_.Exception.Message}
            }
          }
          $rows=@()
          foreach($base in @('http://127.0.0.1:8799','https://home-pc.tail9b1df8.ts.net')){
            $prefix=if($base -like 'http://127*'){'local'}else{'https'}
            $rows += Probe ($prefix+'_root') ($base+'/')
            $rows += Probe ($prefix+'_index') ($base+'/index.html')
            $rows += Probe ($prefix+'_app') ($base+'/app.js?v=2814')
            $rows += Probe ($prefix+'_chat') ($base+'/ai-chat.js?v=2814')
            $rows += Probe ($prefix+'_sw') ($base+'/sw.js?v=2814')
          }
          $dst='C:\FRAME\Owner-Test-2812\frontend'
          $local=@()
          foreach($name in @('index.html','app.js','ai-chat.js','sw.js','version-fix.js')){
            $p=Join-Path $dst $name
            if(Test-Path $p){$text=Get-Content $p -Raw;$local += [pscustomobject]@{name=$name;sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();has_2814=($text -match '2\.8\.14|2814');has_helper=($text -match 'frameDeleteObjectFromChat');has_gate=($text -match 'frameObjectDeleteApplyDecision')}}
          }
          Write-Host 'ROUTE_PROBES'
          Write-Host ($rows|ConvertTo-Json -Depth 4)
          Write-Host 'LOCAL_FRONTEND'
          Write-Host ($local|ConvertTo-Json -Depth 4)
          Write-Host 'WORKING_2814_ROUTE_PROBE_COMPLETE'
