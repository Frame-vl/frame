name: FRAME find python runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-working-object-delete.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Find persistent Python runtime
        shell: cmd
        run: |
          @echo off
          echo WHOAMI
          whoami
          echo WHERE_PYTHON
          where python 2>nul
          where python.exe 2>nul
          where py 2>nul
          echo COMMON_PYTHONS
          dir /s /b C:\Python*\python.exe 2>nul
          dir /s /b C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe 2>nul
          dir /s /b C:\actions-runner\_work\_tool\FRAMEPython\*\x64\python.exe 2>nul
          echo PYTHON_RUNTIME_DISCOVERY_COMPLETE
