name: FRAME inspect launcher code
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-working-object-delete.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Inspect safe launcher code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'C:\FRAME\Owner-Test-2812\runtime\gateway.py',
            'C:\FRAME\Owner-Test-2812\runtime\backend_start.py',
            'C:\FRAME\AI-Server-Field-v030\frame_field_public_start.py',
            'C:\FRAME\AI-Server-Field-v030\legacy_auth_proxy.py',
            'C:\FRAME\AI-Server-Field-v030\frame_field_public_watchdog.py'
          )){
            Write-Host ('===== '+$p+' =====')
            $text=Get-Content $p -Raw
            $text=$text -replace '(?i)(token\s*[=:]\s*)(["''][^"'']+["'']|[^\s]+)','$1[REDACTED]'
            if($text.Length -gt 18000){$text=$text.Substring(0,18000)}
            Write-Host $text
          }
          Write-Host 'LAUNCHER_CODE_INSPECT_COMPLETE'
