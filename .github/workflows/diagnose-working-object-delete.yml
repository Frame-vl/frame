name: FRAME inspect runtime tree
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-working-object-delete.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Inspect runtime tree without owner DB access
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          foreach($root in @('C:\FRAME\Owner-Test-2812','C:\FRAME\AI-Server-Field-v030')){
            Write-Host ('ROOT='+$root)
            Get-ChildItem $root -Force -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ('L1 '+$_.Name+' type='+(if($_.PSIsContainer){'dir'}else{'file'})+' bytes='+(if($_.PSIsContainer){0}else{$_.Length}))
              if($_.PSIsContainer){
                Get-ChildItem $_.FullName -Force -ErrorAction SilentlyContinue | Select-Object -First 80 | ForEach-Object {
                  Write-Host ('L2 '+$_.FullName.Replace($root+'\','')+' type='+(if($_.PSIsContainer){'dir'}else{'file'})+' bytes='+(if($_.PSIsContainer){0}else{$_.Length}))
                }
              }
            }
          }
          Write-Host 'RUNTIME_TREE_COMPLETE owner_db_accessed=false'
