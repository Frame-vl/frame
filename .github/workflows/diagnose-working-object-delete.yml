name: FRAME locate live gateway proxy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-working-object-delete.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Locate exact live launcher files
        shell: cmd
        run: |
          @echo off
          echo OWNER_TEST_GATEWAY_FILES
          dir /s /b C:\FRAME\Owner-Test-2812\*gateway*.py 2>nul
          dir /s /b C:\FRAME\Owner-Test-2812\*start*.py 2>nul
          echo FIELD_PROXY_FILES
          dir /s /b C:\FRAME\AI-Server-Field-v030\*proxy*.py 2>nul
          dir /s /b C:\FRAME\AI-Server-Field-v030\*public*.py 2>nul
          dir /s /b C:\FRAME\AI-Server-Field-v030\*watchdog*.py 2>nul
          echo OWNER_TEST_TOP
          dir /b C:\FRAME\Owner-Test-2812 2>nul
          echo LIVE_LAUNCHER_PATHS_COMPLETE
