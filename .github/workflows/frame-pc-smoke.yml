name: FRAME PC Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Runner info
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          $py = Get-Command python -ErrorAction SilentlyContinue
          if ($py) {
            Write-Host "Python: $($py.Source)"
            python --version
          } else {
            Write-Host "Python is not visible to the runner service yet; continuing smoke checks."
          }

      - name: Check FRAME AI port
        shell: powershell
        run: |
          $r = Test-NetConnection -ComputerName 127.0.0.1 -Port 8787 -WarningAction SilentlyContinue
          Write-Host "FRAME AI 127.0.0.1:8787 TcpTestSucceeded=$($r.TcpTestSucceeded)"
          if (-not $r.TcpTestSucceeded) { exit 1 }

      - name: Check FRAME AI health
        shell: powershell
        run: |
          $token = [Environment]::GetEnvironmentVariable("FRAME_AI_TOKEN", "Machine")
          if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Host "FRAME_AI_TOKEN is not available in Machine environment."
            exit 1
          }
          try {
            $headers = @{ Authorization = "Bearer $token" }
            $res = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8787/health" -Headers $headers -TimeoutSec 15
            Write-Host "HTTP $($res.StatusCode)"
            Write-Host $res.Content
          } catch {
            Write-Host "Health request failed: $($_.Exception.Message)"
            exit 1
          }
