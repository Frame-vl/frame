name: FRAME AI Tests

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'ai-chat.js'
      - 'ai-guard.js'
      - 'tests/ai/**'
      - '.github/workflows/frame-ai-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frame-ai-regression
  cancel-in-progress: true

jobs:
  ai-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      FRAME_AI_URL: http://127.0.0.1:8787
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FRAME_EXPECTED_RUNNER: FRAME-PC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve existing FRAME Python
        run: call tests\\ai\\resolve-python.cmd

      - name: Check FRAME AI health
        run: python -X utf8 tests\ai\ci.py health

      - name: Check deterministic guard contract
        run: python -X utf8 tests\ai\ci.py contract

      - name: Run AI guard in real browser engine
        run: python -X utf8 tests\ai\ci.py browser guard

      - name: Run FRAME chat end-to-end in real browser engine
        run: python -X utf8 tests\ai\ci.py browser ui

      - name: Run FRAME AI regression suite
        run: python -X utf8 tests\ai\runner.py

      - name: Publish test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FRAME_CI_JOB_STATUS: ${{ job.status }}
        run: python -X utf8 tests\ai\ci.py status
