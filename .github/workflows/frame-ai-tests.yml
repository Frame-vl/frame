name: FRAME UI Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'ai-chat.js'
      - 'ai-guard.js'
      - 'tests/ai/ci.py'
      - 'tests/ai/guard-harness.html'
      - 'tests/ai/ui-harness.html'
      - 'tests/ai/resolve-python.cmd'
      - 'tests/ai/find-python.vbs'
      - '.github/workflows/frame-ai-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frame-ui-safety
  cancel-in-progress: true

jobs:
  ui-safety:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FRAME_EXPECTED_RUNNER: FRAME-PC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve existing FRAME Python
        run: call tests\ai\resolve-python.cmd

      - name: Check deterministic guard contract
        run: '"%FRAME_PYTHON%" -X utf8 tests\ai\ci.py contract'

      - name: Run AI guard in real browser engine
        run: '"%FRAME_PYTHON%" -X utf8 tests\ai\ci.py browser guard'

      - name: Run FRAME chat end-to-end in real browser engine
        run: '"%FRAME_PYTHON%" -X utf8 tests\ai\ci.py browser ui'

      - name: Publish test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FRAME_CI_JOB_STATUS: ${{ job.status }}
        run: '"%FRAME_PYTHON%" -X utf8 tests\ai\ci.py status'
