name: Apply FRAME 2.6.2

on:
  push:
    paths:
      - '.frame-deploy/frame262.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .frame-deploy/apply262.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -q "const VERSION='2.6.2'" app.js
          grep -q "orderWorkProgress(order).ready" app.js
          if grep -q "orderReadyToClose(order)" app.js; then exit 1; fi
          grep -q "activeWorkBtn" app.js
          grep -q "showQuickPaymentSheet" app.js
          grep -q 'id="aiBrainState"' app.js
          grep -q "frame-v262-field-hotfix" sw.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .frame-deploy
          rm -f .github/workflows/apply-frame262.yml
          git config user.name "FRAME Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "FRAME 2.6.2 field hotfix"
          git push
