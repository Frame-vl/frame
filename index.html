<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FRAME">
<meta name="format-detection" content="telephone=no">
<title>FRAME 2.5.1 AI Brain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=251">
</head>
<body>
<div id="appSplash" aria-hidden="true"><div class="splashInner"><div class="splashLogo">FRAME</div><div class="splashLine"></div></div></div>
<div class="shell">
<header class="topbar">
  <button id="brandHome" class="brandButton" type="button" aria-label="На главный экран">
    <span class="brand">FRAME</span><span class="tag">Design. Build. Finish.</span>
  </button>
  <div class="topActions">
    <button id="globalDocsBtn" class="iconBtn" type="button" aria-label="Документы" title="Документы"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h9.5L19 7.25V20.25H6z"/><path d="M15.5 3.75v3.5H19M9 11h6M9 14h6M9 17h3"/><path class="accentStroke" d="M4.5 8.5h3"/></svg></button>
    <button id="settingsBtn" class="iconBtn" type="button" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z"/><path d="M19.25 13.4v-2.8l-2-.55a7 7 0 0 0-.58-1.4l1.02-1.8-1.98-1.98-1.8 1.02a7 7 0 0 0-1.4-.58l-.55-2H9.18l-.55 2a7 7 0 0 0-1.4.58l-1.8-1.02-1.98 1.98 1.02 1.8a7 7 0 0 0-.58 1.4l-2 .55v2.8l2 .55c.14.49.34.96.58 1.4l-1.02 1.8 1.98 1.98 1.8-1.02c.44.24.91.44 1.4.58l.55 2h2.8l.55-2c.49-.14.96-.34 1.4-.58l1.8 1.02 1.98-1.98-1.02-1.8c.24-.44.44-.91.58-1.4z"/></svg></button>
    <div class="themeSwitch" role="group" aria-label="Тема приложения">
      <button id="lightBtn" type="button" aria-label="Дневная тема">☀️</button>
      <button id="darkBtn" type="button" aria-label="Ночная тема">🌙</button>
    </div>
    <div class="build">2.5.1</div>
  </div>
</header>
<main id="viewHost" aria-live="polite"></main>
</div>

<div id="sheet" class="sheet" aria-hidden="true"><div id="sheetPanel" class="sheetPanel"></div></div>
<div id="documentView" class="documentView hidden">
  <div class="docActions"><button id="closeDocumentBtn" class="btn ghost">Назад</button><button id="printDocumentBtn" class="btn primary">Печать / PDF</button></div>
  <div id="paperStage" class="paperStage"><div id="paper" class="paper"></div></div>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js?v=251"></script>
<script>window.addEventListener('load',()=>{const s=document.getElementById('appSplash');setTimeout(()=>{s?.classList.add('hide');setTimeout(()=>s?.remove(),260)},180)});</script>
</body>
</html>
