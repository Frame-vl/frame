<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FRAME">
<meta name="format-detection" content="telephone=no">
<title>FRAME 1.7.0 Field</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="topbar">
  <button id="brandHome" class="brandButton" type="button" aria-label="На главный экран">
    <span class="brand">FRAME</span><span class="tag">Design. Build. Finish.</span>
  </button>
  <div class="topActions">
    <button id="globalDocsBtn" class="iconBtn" type="button" aria-label="Документы" title="Документы">▤</button>
    <button id="settingsBtn" class="iconBtn" type="button" aria-label="Настройки" title="Настройки">⚙︎</button>
    <div class="themeSwitch" role="group" aria-label="Тема приложения">
      <button id="lightBtn" type="button" aria-label="Дневная тема">☀️</button>
      <button id="darkBtn" type="button" aria-label="Ночная тема">🌙</button>
    </div>
    <div class="build">1.7.0</div>
  </div>
</header>
<main id="viewHost" aria-live="polite"></main>
</div>

<div id="sheet" class="sheet" aria-hidden="true"><div id="sheetPanel" class="sheetPanel"></div></div>
<div id="documentView" class="documentView hidden">
  <div class="docActions"><button id="closeDocumentBtn" class="btn ghost">Назад</button><button id="printDocumentBtn" class="btn primary">Печать / PDF</button></div>
  <div id="paper" class="paper"></div>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
